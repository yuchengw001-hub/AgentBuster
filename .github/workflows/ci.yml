name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        timeout-minutes: 3
      - name: Run 20 MCP stability rounds on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: npm run test:stability
      - run: npm run check:release
      - run: npm run demo
      - run: node bin/agentbuster.js showcase
      - name: Pack, install and test the actual tarball
        timeout-minutes: 3
        run: npm run verify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.node }}
          path: reports/validation/*.json
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: release-package
          path: reports/release/*/*
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release AgentBuster v'))
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          merge-multiple: true
          path: release
      - name: Publish the tested package and validation records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title "AgentBuster $tag — Early Access" --notes-file "docs/RELEASE-$tag.md"
